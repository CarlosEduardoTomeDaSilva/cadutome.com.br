# Publica o site no GitHub Pages (cadutome.com.br) a cada push na main
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # todo dia às 6h de Brasília, para atualizar o mapa de commits
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualiza os dados de commits
        run: npm run activity
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
