<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O ?v= força o navegador a trocar o ícone em cache. Aumente o número ao trocar a imagem. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <title>Carlos Eduardo Tomé da Silva | Produto</title>
    <meta
      name="description"
      content="Fundador do RankUp e da Oasis Beach. Construo produto do modelo de receita ao código em produção."
    />
    <meta name="theme-color" content="#F3ECDF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1E24" media="(prefers-color-scheme: dark)" />

    <link rel="canonical" href="https://cadutome.com.br/" />

    <!-- Prévia do link no LinkedIn e no WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cadutome.com.br/" />
    <meta property="og:image" content="https://cadutome.com.br/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carlos Eduardo Tomé da Silva" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Carlos Eduardo Tomé da Silva | Produto" />
    <meta
      property="og:description"
      content="Fundador do RankUp e da Oasis Beach. Construo produto do modelo de receita ao código em produção."
    />

    <!-- Aplica o tema antes da primeira pintura para evitar flash de cor -->
    <script>
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
